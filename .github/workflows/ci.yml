name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }}, nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is EOL, and 22.12 is the oldest line where require(esm) is
        # unflagged (what CommonJS consumers on NestJS 12 rely on); matches engines.node.
        node: [22, 24]
        # The lockfile pins NestJS 12; the 11 leg swaps in the previous major
        # so both halves of the peer range stay verified.
        nest: [11, 12]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @nestjs/config never had a 5..11: its NestJS 11 line is 4.x, and it
      # jumped straight to 12.x to follow the framework release line.
      - name: Switch to NestJS 11
        if: matrix.nest == 11
        run: pnpm add -D @nestjs/common@11 @nestjs/core@11 @nestjs/testing@11 @nestjs/config@4

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:cov

      - name: Build
        run: pnpm run build

      - name: Publint
        run: npx publint

      - name: Are the types wrong?
        run: npx attw --pack .
